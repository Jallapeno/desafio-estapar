services:
  mysql:
    image: mysql:8.0
    container_name: estapar-mysql
    restart: unless-stopped
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-estapar_garage}
      MYSQL_USER: ${DB_USER:-estapar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estapar}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - estapar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  estapar_mysql_data:
