micronaut:
  server:
    port: -1

datasources:
  default:
    url: jdbc:tc:mysql:8.0:///estapar_garage?TC_DAEMON=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useTimezone=true
    username: ""
    password: ""
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    db-type: mysql
    dialect: MYSQL

simulator:
  sync-on-startup: false
  retry:
    attempts: 3
    delay: 20ms
    multiplier: 1.0
