micronaut:
  application:
    name: estapar-parking-service
  server:
    port: ${SERVER_PORT:3003}

datasources:
  default:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:estapar_garage}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useTimezone=true&createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    db-type: mysql
    dialect: MYSQL

flyway:
  datasources:
    default:
      enabled: true

simulator:
  base-url: ${SIMULATOR_URL:http://localhost:8080}
  sync-on-startup: ${SIMULATOR_SYNC_ON_STARTUP:true}
  retry:
    attempts: ${SIMULATOR_RETRY_ATTEMPTS:5}
    delay: ${SIMULATOR_RETRY_DELAY:1s}
    multiplier: ${SIMULATOR_RETRY_MULTIPLIER:2.0}
