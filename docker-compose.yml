services:
  mysql:
    image: mysql:8.0
    container_name: estapar-mysql
    restart: unless-stopped
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-estapar_garage}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - estapar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  estapar_mysql_data:
