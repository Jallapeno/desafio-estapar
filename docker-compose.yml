services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-estapar_garage}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - estapar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  simulator:
    image: cfontes0estapar/garage-sim:1.0.0
    restart: unless-stopped
    environment:
      CLIENT_WEBHOOK_URL: http://api:3003/webhook
    ports:
      - "${SIMULATOR_PORT:-8080}:3000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-estapar_garage}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SIMULATOR_URL: http://simulator:3000
    ports:
      - "${SERVER_PORT:-3003}:3003"
    depends_on:
      mysql:
        condition: service_healthy
      simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:3003/swagger/estapar.yml"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  estapar_mysql_data:
